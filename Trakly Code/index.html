<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Trakly</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="CSS/style.css" />
    <link rel="icon" type="image/x-icon" href="Photos/favicon.ico" />
</head>
<body class="bg-body-tertiary">
    <div class="sidebar-overlay position-fixed top-0 start-0 w-100 h-100 bg-dark bg-opacity-50" id="sidebarOverlay"></div>

    <div class="d-flex min-vh-100">
        <aside class="sidebar app-sidebar position-fixed top-0 start-0 vh-100 d-flex flex-column bg-body border-end shadow-sm" id="sidebar">
            <div class="p-3 border-bottom">
                <div class="d-flex align-items-center gap-2">
                    <div class="sidebar-avatar fw-bold text-white d-flex align-items-center justify-content-center rounded-3" id="sidebarAvatar">T</div>
                    <div>
                        <div class="h5 mb-0 text-primary fw-bold">Trakly</div>
                        <div class="small text-secondary">Track Everything of Your Life</div>
                    </div>
                </div>
            </div>

            <nav class="sidebar-nav flex-grow-1 p-3" aria-label="Main Navigation">
                <div class="text-uppercase small text-secondary fw-semibold mb-2">Overview</div>
                <button class="nav-btn active btn w-100 text-start d-flex align-items-center gap-2 mb-2" data-view="dashboard" type="button">
                    <span class="nav-icon"><i class="bi bi-grid-1x2"></i></span><span>Dashboard</span>
                </button>

                <div class="text-uppercase small text-secondary fw-semibold mt-3 mb-2">Modules</div>
                <button class="nav-btn btn w-100 text-start d-flex align-items-center gap-2 mb-2" data-view="calendar" type="button">
                    <span class="nav-icon"><i class="bi bi-calendar3"></i></span><span>Calendar Hub</span>
                </button>
                <button class="nav-btn btn w-100 text-start d-flex align-items-center gap-2 mb-2" data-view="finance" type="button">
                    <span class="nav-icon"><i class="bi bi-wallet2"></i></span><span>Finance Tracker</span>
                </button>

                <div class="text-uppercase small text-secondary fw-semibold mt-3 mb-2">System</div>
                <button class="nav-btn btn w-100 text-start d-flex align-items-center gap-2 mb-2" data-view="settings" type="button">
                    <span class="nav-icon"><i class="bi bi-gear"></i></span><span>Settings & Backup</span>
                </button>
                <button class="nav-btn btn w-100 text-start d-flex align-items-center gap-2" data-view="about" type="button">
                    <span class="nav-icon"><i class="bi bi-info-circle"></i></span><span>About Trakly</span>
                </button>
            </nav>

            <div class="sidebar-footer p-3 border-top">
                <button class="theme-toggle-btn btn btn-outline-secondary w-100 d-flex align-items-center gap-2 justify-content-center" id="themeToggleBtn" type="button">
                    <i class="bi bi-moon-stars"></i><span>Toggle Theme</span>
                </button>
            </div>
        </aside>

        <div class="main-wrapper flex-grow-1 d-flex flex-column">
            <header class="topbar sticky-top bg-body border-bottom shadow-sm">
                <div class="d-flex align-items-center gap-2">
                    <button class="mobile-menu-btn btn btn-outline-secondary d-lg-none" id="mobileMenuBtn" type="button">
                        <i class="bi bi-list"></i>
                    </button>
                    <span class="topbar-title fw-semibold text-body" id="topbarTitle">Dashboard</span>
                </div>

                <div class="d-flex align-items-center gap-2">
                    <div class="global-search-wrap position-relative d-none d-md-flex align-items-center gap-2 px-3 py-2 border rounded-3 bg-body-secondary" id="globalSearchWrap">
                        <i class="bi bi-search text-secondary global-search-icon"></i>
                        <input type="text" id="globalSearchInput" class="global-search-input border-0 bg-transparent" placeholder="Search tasks, events, transactions..." autocomplete="off" />
                        <div class="global-search-results" id="globalSearchResults"></div>
                    </div>

                    <span class="topbar-date small text-secondary d-none d-lg-inline" id="topbarDate">Today</span>

                    <div class="notification-wrap position-relative">
                        <button class="topbar-icon-btn btn btn-outline-secondary d-flex align-items-center justify-content-center" type="button" id="notificationBtn" aria-label="Notifications">
                            <i class="bi bi-bell"></i>
                            <span class="notification-dot" id="notificationDot"></span>
                        </button>
                        <div class="notification-panel" id="notificationPanel" aria-hidden="true">
                            <div class="notification-panel-header d-flex align-items-center justify-content-between border-bottom p-2 bg-body">
                                <h6 class="mb-0"><i class="bi bi-bell me-2"></i>Notifications</h6>
                                <button type="button" class="btn btn-sm btn-outline-secondary" id="markAllReadBtn">Mark all read</button>
                            </div>
                            <div class="notification-panel-body" id="notificationList"></div>
                            <div class="notification-empty d-none p-3 small text-secondary" id="notificationEmpty">
                                <i class="bi bi-check2-circle me-1"></i><span>No new notifications</span>
                            </div>
                        </div>
                    </div>

                    <div class="topbar-profile-badge d-flex align-items-center gap-2 px-2 py-1 border rounded-pill bg-body">
                        <div class="topbar-avatar-sm rounded-circle d-flex align-items-center justify-content-center fw-bold text-white" id="topbarAvatarSm">T</div>
                        <span class="topbar-profile-name small fw-semibold" id="topbarProfileName">User</span>
                    </div>
                </div>
            </header>

            <main class="main-content flex-grow-1 p-3 p-lg-4">
                <section id="notification-area" class="mb-3"></section>
                <section id="view-container"></section>
            </main>

            <footer class="app-footer text-center py-3 border-top bg-body">
                <small class="app-footer-text text-secondary">Trakly &copy; 2026 - Personal Productivity SPA Project</small>
            </footer>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
